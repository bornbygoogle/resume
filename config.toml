# ─────────────────────────────────────────────────────────────
# Site configuration — bilingual (EN/FR) ATS-first resume
# All translated resume content lives under [languages.<lang>.params]
# Shared (non-translated) params stay in the top-level [params] block.
# ─────────────────────────────────────────────────────────────

baseURL = "https://elegant-malabi-169652.netlify.app"
title = "Minh-An TRAN"
enableGitInfo = false
enableRobotsTXT = false          # we ship a hand-written static/robots.txt

# Bilingual: English default at /en/, French at /fr/, root redirects to /en/
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

# googleAnalytics — re-enable with a real GA4 id (G-XXXX) when available
# googleAnalytics = "G-XXXXXXXXXX"

# ── Shared params (identical across languages) ───────────────
[params]
    author = "Minh-An TRAN"
    twitterName = "@bornbygoogle"
    ghRepo = "https://github.com/bornbygoogle/"
    hugoRepo = "https://github.com/gohugoio/hugo/"
    og_image = "assets/images/photo.jpg"

