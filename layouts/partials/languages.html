<section class="section" aria-labelledby="languages-heading">
  <h2 class="section__title" id="languages-heading">{{ i18n "languages" }}</h2>

  <ul class="entries">
    {{ range .Site.Params.languages.list }}
    <li class="entry">
      <div class="entry__title">{{ .name }}</div>
      <div class="entry__level">{{ .level }}</div>
    </li>
    {{ end }}
  </ul>
</section>
