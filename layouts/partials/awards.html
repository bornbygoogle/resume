<section class="section" aria-labelledby="certifications-heading">
  <h2 class="section__title" id="certifications-heading">{{ i18n "certifications" }}</h2>

  <ul class="entries">
    {{ range .Site.Params.awards.list }}
    <li class="entry">
      <div class="entry__title">{{ .name }}</div>
      <div class="entry__org">{{ .body }}</div>
      <div class="entry__time">{{ .date }}</div>
    </li>
    {{ end }}
  </ul>
</section>
