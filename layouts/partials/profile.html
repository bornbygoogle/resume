<div class="profile">
  {{ with .Site.Params.profile.avatar }}
  <img
    class="profile__avatar"
    src="/assets/images/{{ . }}"
    alt="{{ $.Site.Params.profile.name }}"
    width="88"
    height="88"
    loading="eager"
  />
  {{ end }}
  <div class="profile__text">
    <h1 class="profile__name">{{ .Site.Params.profile.name }}</h1>
    <p class="profile__headline">{{ .Site.Params.profile.headline }}</p>
  </div>
</div>
