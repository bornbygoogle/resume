<section class="section" aria-labelledby="skills-heading">
  <h2 class="section__title" id="skills-heading">{{ i18n "skills" }}</h2>

  {{ range .Site.Params.skills.list }}
  <div class="skill-group">
    <h3 class="skill-group__title">{{ .category }}</h3>
    <ul class="skill-group__list">
      {{ range .items }}<li class="chip">{{ . }}</li>{{ end }}
    </ul>
  </div>
  {{ end }}
</section>
