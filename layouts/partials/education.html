<section class="section" aria-labelledby="education-heading">
  <h2 class="section__title" id="education-heading">{{ i18n "education" }}</h2>

  <ul class="entries">
    {{ range .Site.Params.education.list }}
    <li class="entry">
      <div class="entry__title">{{ .degree }}</div>
      <div class="entry__org">{{ .university }}</div>
      <div class="entry__time">{{ .dates }}</div>
    </li>
    {{ end }}
  </ul>
</section>
