<div class="resume__topbar">
  <div class="resume__topbar-left">
    <nav class="lang-switch" aria-label="{{ i18n "language_switch_label" }}">
      {{ range .Sites }}
        {{ $lang := .Language.Lang }}
        {{ $href := (printf "/%s/" $lang) | relURL }}
        <a class="lang-switch__link" href="{{ $href }}" hreflang="{{ $lang }}" lang="{{ $lang }}"{{ if eq $lang $.Language.Lang }} aria-current="true"{{ end }}>{{ $lang | upper }}</a>
      {{ end }}
    </nav>
  </div>

  <div class="resume__topbar-right">
    <a class="btn btn--ghost" href="{{ printf "/resume.%s.a4.pdf" .Lang | relURL }}" aria-label="{{ i18n "download_pdf_a4" }}">
      <i class="fas fa-file-pdf" data-icon aria-hidden="true"></i><span>{{ i18n "download_pdf_a4" }}</span>
    </a>
    <a class="btn btn--ghost" href="{{ printf "/resume.%s.letter.pdf" .Lang | relURL }}" aria-label="{{ i18n "download_pdf_letter" }}">
      <i class="fas fa-file-arrow-down" data-icon aria-hidden="true"></i><span>{{ i18n "download_pdf_letter" }}</span>
    </a>

    <label class="theme-toggle">
      <input type="checkbox" id="darkSwitch" />
      <span class="theme-toggle__track"><span class="theme-toggle__thumb"></span></span>
      <span class="visually-hidden">{{ i18n "dark_mode" }}</span>
    </label>
  </div>
</div>
