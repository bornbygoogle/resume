<section class="section" aria-labelledby="projects-heading">
  <h2 class="section__title" id="projects-heading">{{ i18n "projects" }}</h2>

  {{ range .Site.Params.projects.list }}
  <article class="item">
    <div class="item__head">
      <h3 class="item__title"><a href="{{ .url | safeURL }}" target="_blank" rel="noopener">{{ .title }}</a></h3>
      {{ with .meta }}<span class="item__meta">{{ . }}</span>{{ end }}
    </div>
    {{ with .tagline }}<p class="item__body">{{ . | markdownify }}</p>{{ end }}
  </article>
  {{ end }}
</section>
