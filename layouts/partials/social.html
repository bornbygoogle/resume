<nav class="social" aria-label="{{ i18n "social_links" }}">
  <ul class="social__list">
    {{ range .Site.Params.social.list }}
    <li>
      <a class="social__link" href="{{ .url | safeURL }}" target="_blank" rel="noopener">
        <i class="{{ .icon }}" data-icon aria-hidden="true"></i>
        <span>{{ .title }}</span>
      </a>
    </li>
    {{ end }}
  </ul>
</nav>
